name: Release

# Neue Version veroeffentlichen: Version in gradle.properties und CHANGELOG.md eintragen,
# committen, dann ein Tag wie "v0.1.1" pushen. Der Workflow baut das Jar, haengt es an ein
# GitHub-Release und laedt es auf CurseForge hoch.
# Voraussetzung: Repository-Secret CURSEFORGE_TOKEN und curseforge_project_id in gradle.properties.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build publishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: CHANGELOG.md
